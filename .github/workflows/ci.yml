name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and shfmt
        # Pinned so CI and a developer's machine flag exactly the same things;
        # the apt build lags far enough behind to disagree about new checks.
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHFMT_VERSION: v3.14.0
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          sudo curl -sSfL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version
      - run: make lint
      - run: make fmt-check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - run: make test

  install:
    # A full install into a throwaway HOME, then doctor, then uninstall.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install tmux jq
      - name: Install, verify, uninstall
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          ./install.sh --yes --no-brew
          # claude itself is not available on CI, so doctor is expected to fail
          # on that one check; assert the rest by grepping its output.
          # doctor exits non-zero here because the claude CLI is not on CI,
          # so assert the individual checks instead of the exit status.
          set +e
          output=$(PATH="$HOME/.local/bin:$PATH" NO_COLOR=1 ./bin/claude-tmux-doctor)
          set -e
          echo "$output"
          grep -q "ok    plugin tmux present" <<<"$output"
          grep -q "ok    .teammateMode = tmux" <<<"$output"
          grep -q "ok    claude-tmux on PATH" <<<"$output"
          ./uninstall.sh
