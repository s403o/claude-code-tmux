# ============================================================================
# tmux configuration for Claude Code agent teams
# https://github.com/s403o/claude-code-tmux
#
# Installed by install.sh as a symlink at ~/.tmux.conf. Paths below point at
# ~/.config/claude-tmux, which install.sh links to the repository checkout.
# ============================================================================

# --- Core settings -----------------------------------------------------------

set -g default-terminal "tmux-256color"       # 256 colour terminfo
set -as terminal-overrides ",*:RGB"           # true colour passthrough
set -sg escape-time 0                         # no delay after Escape
set -g history-limit 50000                    # scrollback per pane
set -g mouse on                               # click panes, resize, scroll
set -g base-index 1                           # windows start at 1
setw -g pane-base-index 1                     # panes start at 1
set -g renumber-windows on                    # close a window, fill the gap
set -g focus-events on                        # pass focus events to programs

# --- Pane behaviour ----------------------------------------------------------
# Claude Code spawns each teammate into its own pane. remain-on-exit off means
# a finished agent's pane disappears instead of leaving a dead frame behind.

set -g remain-on-exit off
set -g display-panes-time 2000
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #S "

set -g set-titles on
set -g set-titles-string "#S"

# --- Prefix: Ctrl+a ----------------------------------------------------------

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Key bindings ------------------------------------------------------------

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Split in the current pane's directory rather than the session's start dir
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Move between agent panes without the prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize without the prefix
bind -n C-M-Left  resize-pane -L 5
bind -n C-M-Right resize-pane -R 5
bind -n C-M-Up    resize-pane -U 3
bind -n C-M-Down  resize-pane -D 3

bind x kill-pane
bind S setw synchronize-panes \; display-message "Sync #{?synchronize-panes,ON,OFF}"

# Layouts for watching a team work
bind t select-layout tiled             # equal space for every agent
bind v select-layout main-vertical     # lead pane left, agents stacked right
bind h select-layout main-horizontal   # lead pane on top, agents below

setw -g main-pane-width 50%
setw -g main-pane-height 50%

# --- Theme and plugin options (must come before the plugins load) ------------

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "default"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_text ""                # window tabs hidden: one
set -g @catppuccin_window_current_text ""        # window per session here

set -g @cpu_medium_thresh "50"
set -g @cpu_high_thresh "80"
set -g @ram_medium_thresh "60"
set -g @ram_high_thresh "85"

# --- Load plugins (synchronously, order matters) -----------------------------

run-shell ~/.tmux/plugins/tmux/catppuccin.tmux
run-shell ~/.tmux/plugins/tmux-cpu/cpu.tmux
run-shell ~/.tmux/plugins/tmux-battery/battery.tmux

# --- Mouse select-to-copy (macOS) --------------------------------------------

bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# --- Status bar --------------------------------------------------------------
# Left:  session | git branch | directory
# Right: CPU | RAM | load | hostname

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 120
set -g status-right-length 120

# No -F here: #S and #{pane_current_path} must stay live until render time
set  -g status-left "#{E:@catppuccin_status_session}"
set -ag status-left "#{E:@catppuccin_status_gitmux}"
set -ag status-left "#{E:@catppuccin_status_directory}"

# CPU needs -F for its nested #{l:...} format; RAM and load come from scripts
set  -gF status-right "#{E:@catppuccin_status_cpu}"
set -ag  status-right "#[fg=#fab387]#[fg=#11111b,bg=#fab387]  #[fg=#cdd6f4,bg=#313244] #(~/.config/claude-tmux/scripts/ram.sh) #[fg=#313244,bg=default] "
set -ag  status-right "#[fg=#89b4fa]#[fg=#11111b,bg=#89b4fa] 󰄉 #[fg=#cdd6f4,bg=#313244] #(~/.config/claude-tmux/scripts/load.sh) #[fg=#313244,bg=default] "
set -ag  status-right "#{E:@catppuccin_status_host}"

# --- TPM ---------------------------------------------------------------------
# install.sh clones these at the pinned versions; prefix + I updates them later.

set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'

# --- Post-plugin overrides ---------------------------------------------------
# TPM re-sources plugin configs, so catppuccin's window tab defaults come back.
# Blank them again here, after TPM has run.

set -g window-status-format ""
set -g window-status-current-format ""
